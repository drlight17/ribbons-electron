<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: Arial, sans-serif;
      background: #0b0e16;
      color: #e8ecf7;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      box-sizing: border-box;
      user-select: none;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .version { color: #8fb7ff; font-size: 16px; margin-bottom: 12px; }
    p { color: #b9c2d8; line-height: 1.45; margin: 0 0 18px; }
    .remember { display: flex; gap: 8px; align-items: center; color: #b9c2d8; margin-bottom: 20px; }
    .actions { margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      border: 1px solid #2c3448;
      background: #151b28;
      color: #e8ecf7;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1e2638; }
    button.primary { background: #2867e8; border-color: #2867e8; }
    button.primary:hover { background: #3b77f0; }
    button.hidden { display: none; }
  </style>
</head>
<body>
  <h1 id="title">New version is available</h1>
  <div class="version" id="version"></div>
  <p id="ask">Do you want to visit the download page?</p>
  <label class="remember"><input type="checkbox" id="remember" /><span id="rememberLabel">Don't ask until the next release</span></label>
  <div class="actions">
    <button class="primary" id="yes">Yes</button>
    <button id="no">No</button>
    <button id="install" class="hidden">Update app</button>
  </div>
  <script type="module" src="update.js"></script>
</body>
</html>
