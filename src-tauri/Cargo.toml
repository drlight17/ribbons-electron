[package]
name = "ribbons-tauri"
version = "1.0.2"
description = "Ribbons Screensaver for Windows, macOS and Linux"
authors = ["Yuri Samoilov <root@drlight.fun>"]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
homepage = "https://github.com/drlight17/ribbons-tauri"
default-run = "ribbons-tauri"

[lib]
name = "ribbons_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
semver = "1"
sys-locale = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["time", "sync", "rt", "signal", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
window-vibrancy = "0.8"
active-win-pos-rs = "0.11"
hidapi = "2"

[target.'cfg(target_os = "linux")'.dependencies]
user-idle = { version = "0.6", default-features = false, features = ["dbus"] }
zbus = "5"
libc = "0.2"
gtk = "0.18"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
x11rb = { version = "0.13", features = ["image"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
user-idle = "0.6"
cpal = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_StationsAndDesktops", "Win32_System_Threading"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc = "0.2"
